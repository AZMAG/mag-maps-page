name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

# Prevent overlapping deploys from stomping on each other
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    env:
      PROD_PATH: D:\wwwroot\maps\project-directory
      TEST_PATH: Y:\maps\project-directory
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor %GITHUB_SHA% origin/main
          if %ERRORLEVEL% NEQ 0 (
            echo Tag commit %GITHUB_SHA% is not on main.
            exit /b 1
          )

      - name: Determine deployment environment
        id: deploy-target
        shell: powershell
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -match '^v\d+\.\d+\.\d+$') {
            'DEPLOY_ENV=production' >> $env:GITHUB_ENV
            'environment=production' >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:TAG_NAME -match '^v\d+\.\d+\.\d+-.+$') {
            'DEPLOY_ENV=testing' >> $env:GITHUB_ENV
            'environment=testing' >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Error "Tag '$env:TAG_NAME' is not deployable. Use v#.#.# for production or v#.#.#-* for testing."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          (
            echo VITE_ESRI_API_KEY=${{ secrets.VITE_ESRI_API_KEY }}
            echo VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
            echo VITE_APP_BASENAME_DEV=/
            echo VITE_APP_BASENAME_TEST=/maps/project-directory/
            echo VITE_APP_BASENAME_PROD=/maps/project-directory/
          ) > .env

      - name: Build (production)
        if: steps.deploy-target.outputs.environment == 'production'
        run: |
          call npm run replace
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          call npx vite build --mode production
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Build (test)
        if: steps.deploy-target.outputs.environment == 'testing'
        run: |
          call npm run replace
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          call npx vite build --mode test
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Verify build output
        run: |
          if not exist "dist\index.html" (
            echo Build did not produce dist\index.html - DEPLOY_ENV=%DEPLOY_ENV%
            exit /b 1
          )

      - name: Deploy to web root
        run: |
          if "%DEPLOY_ENV%"=="production" (set TARGET=%PROD_PATH%) else (set TARGET=%TEST_PATH%)
          if not exist "%TARGET%" mkdir "%TARGET%"
          robocopy dist "%TARGET%" /MIR /NFL /NDL /NJH /NJS
          if %ERRORLEVEL% GEQ 8 (exit /b %ERRORLEVEL%) else (exit /b 0)
